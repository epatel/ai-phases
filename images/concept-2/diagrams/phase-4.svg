ont-weight="700" fill="#0f766e" text-anchor="start">✓ explicit contract per feature</text><text x="158" y="394" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">✗ no quality measurement</text><line x1="172" y1="390" x2="311" y2="390" stroke="#64748b" stroke-width="1.2"/><text x="158" y="416" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f766e" text-anchor="start">✓ code quality measured</text><path d="M462,290 H492" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#ah-dev)"/><rect x="498" y="124" width="282" height="330" rx="16" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="9 6"/><rect x="620" y="114" width="150" height="22" fill="#ffffff"/><g><path d="M630,121 v-4 a5,5 0 0 1 10,0 v4" fill="none" stroke="#ea580c" stroke-width="2"/><rect x="626" y="120" width="18" height="13" rx="2" fill="#ea580c"/></g><text x="652" y="130" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ea580c" text-anchor="start">enforced rules</text><rect x="512" y="140" width="254" height="300" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="528" y="164" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">repository</text><text x="528" y="198" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f766e" text-anchor="start">signup</text><rect x="584" y="180" width="48" height="34" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/><text x="608.0" y="202" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f766e" text-anchor="middle">in</text><line x1="634" y1="197" x2="641" y2="197" stroke="#0f766e" stroke-width="2" marker-end="