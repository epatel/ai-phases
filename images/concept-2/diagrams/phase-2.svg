<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-label="Phase 2: The developer prompts an AI. The project knowledge lives in the developer's head and is re-typed every time.">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  <marker id="ah-ai" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  <marker id="ah-doc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
  <marker id="ah-dev" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  <marker id="ah-stake" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker>
  <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#ea580c" stroke-opacity="0.25" stroke-width="3"/></pattern>
</defs>
<rect x="1" y="1" width="798" height="478" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="32" y="44" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">PHASE 2</text>
<text x="32" y="72" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937" text-anchor="start">The developer prompts an AI</text>
<text x="32" y="98" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">The project knowledge lives in the developer's head and is re-typed every time.</text>
<rect x="36" y="126" width="260" height="120" rx="28" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="112.6" cy="261.4" r="5.95" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><circle cx="111.2" cy="276.8" r="4.9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="56" y="150" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">in the developer's head</text><g><rect x="56" y="162" width="54" height="26" rx="13" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="83.25" y="179.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">React</text></g><g><rect x="118.5" y="162" width="117" height="26" rx="13" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="176.8" y="179.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">tests in /spec</text></g><g><rect x="56" y="196" width="151" height="26" rx="13" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="131.55" y="213.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">don't touch /legacy</text></g><g><circle cx="110" cy="326" r="15" fill="#2563eb"/><path d="M86,374 v-10 a24,22 0 0 1 48,0 v10 z" fill="#2563eb"/><text x="110" y="396" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">Developer</text></g><path d="M155,340 H335" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#ah-dev)"/><text x="245" y="314" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2563eb" text-anchor="middle">prompt + all of that</text><text x="245" y="332" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle" font-style="italic">↻ again, every session</text><g><line x1="390" y1="312" x2="390" y2="300" stroke="#7c3aed" stroke-width="3"/><circle cx="390" cy="297" r="5" fill="#7c3aed"/><rect x="356" y="312" width="68" height="56" rx="14" fill="#7c3aed"/><text x="390" y="347" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">AI</text><text x="390" y="390" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">AI</text><text x="390" y="408" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle" font-style="italic">starts empty each session</text></g><path d="M430,340 H525" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#ah-ai)"/><rect x="540" y="150" width="225" height="290" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="556" y="174" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">repository</text><g><path d="M570,200 H604 L616,212 V256 H570 z" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/><text x="593.0" y="234.0" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0f766e" text-anchor="middle">{ }</text></g><g><path d="M630,200 H664 L676,212 V256 H630 z" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/><text x="653.0" y="234.0" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#0f766e" text-anchor="middle">{ }</text></g><g><path d="M690,200 H724 L736,212 V256 H690 z" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/><text x="713.0" y="234.0" font-family="'SF Mono', Menlo, Consol